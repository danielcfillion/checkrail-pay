# Render Blueprint for the hosted judging demo (rules: judges must be able to test until Dec 15, 2026).
# Create it from the Render dashboard: New, Blueprint, pick the GitHub repo. Secrets marked sync: false
# are typed into the Render dashboard, never committed.
services:
  - type: web
    name: checkrail-pay
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    # The free plan has no persistent disk: every restart reseeds the demo story, which is what a judge wants.
    startCommand: npm run db:seed && npm run start -- -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_PATH
        value: ./data/checkrail-pay.sqlite
      # One shared demo database. Basic auth keeps the open internet out (put the credential in the Devpost
      # testing instructions). It does not separate judges from each other: that is what the idle reset is for.
      # Logins with roles, e.g. judge:<pw>:admin. With personas on, one login can act as each of the demo team.
      - key: CHECKRAIL_USERS
        sync: false
      - key: CHECKRAIL_DEMO_PERSONAS
        value: "1"
      - key: NEXT_PUBLIC_CHECKRAIL_TIMEZONE
        value: Asia/Ho_Chi_Minh
      # Encrypts the demo vendors' full bank account numbers. Render generates a random value once.
      - key: CHECKRAIL_DATA_KEY
        generateValue: true
      # A Vietnamese source account so the judge can see a VND bank file being built (demo account, mock rails).
      - key: BANK_FILE_SOURCE_ACCOUNT
        value: VCB 0071000000000 Ridgeline Vietnam (demo)
      # After 30 minutes with no one clicking, the heartbeat restores the four opening requests, so a judge who
      # arrives later starts clean. Two judges in the same half hour still share state; Reset demo puts it back.
      - key: DEMO_AUTO_RESET_MINUTES
        value: "30"
      # mock = runs with zero credentials; live = real PayPal sandbox (set the keys below).
      - key: RAIL_MODE
        value: mock
      - key: STELLAR_RAIL
        value: mock
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: DEMO_PAYPAL_RECIPIENT
        sync: false
      - key: DEMO_PAYPAL_RECIPIENT_ROSA
        sync: false
      # mock = rule-based reader; live = Claude (set the key below; cap spend in the Anthropic console).
      - key: AI_MODE
        value: mock
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: STUDIO_MODEL
        value: claude-haiku-5-5
      - key: AG_STUDIO
        sync: false
      # Login throttle key. Render's edge (Cloudflare, then Render's load balancers) appends to X-Forwarded-For and
      # Render documents no other client address header, so the app keys on the last X-Forwarded-For entry. If that
      # turns out to be a shared edge address, one visitor's wrong passwords could lock out every judge. To check:
      # set CHECKRAIL_LOG_CLIENT_IP to "1", redeploy, try one wrong password, and read the "[checkrail] failed login"
      # line in the logs. If a header such as cf-connecting-ip shows the visitor's own address, set
      # CHECKRAIL_CLIENT_IP_HEADER to its name; then set CHECKRAIL_LOG_CLIENT_IP back to "0".
      - key: CHECKRAIL_LOG_CLIENT_IP
        value: "0"
      # The judging login is published, so a correct password is let in even when the visitor's address is over its
      # wrong-password limit. Without this, if every visitor shares one throttle key, eleven wrong passwords from
      # anyone would lock every judge out for 15 minutes. Never set this where the login is a secret.
      - key: CHECKRAIL_THROTTLE_SPARES_VALID
        value: "1"
      # Autopilot heartbeat runs inside the single web process.
      - key: AUTOPILOT_HEARTBEAT_SECONDS
        value: "15"
      # The agent endpoint (/api/mcp) on the judging demo: a judge can point an agent at it without a key, as
      # "demo-<hash of its address>" with check_payment only, on simulated rails only (ignored when rails are live or
      # real money can move). Agent keys for
      # named agents go in CHECKRAIL_AGENT_KEYS (name:secret:check, check+request or check+request+attest).
      - key: CHECKRAIL_AGENT_DEMO_OPEN
        value: "1"
      - key: CHECKRAIL_AGENT_KEYS
        sync: false
