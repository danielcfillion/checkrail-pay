[package]
name = "checkrail-spend-policy"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "A Stellar account that an AI payables agent can spend from but cannot abuse: per-payment and rolling 24-hour caps, a payee allow-list, a cancel window and an owner pause key."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "29.0.1"

[dev-dependencies]
soroban-sdk = { version = "29.0.1", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
