# Checkrail Pay inbound REST API. Hand-written; served as JSON at GET /api/v1/openapi.json.
# Keep it to the YAML subset src/lib/api/yaml.ts reads: block maps and lists, quoted or plain scalars, [a, b] lists of
# scalars, {} and block scalars (|, >-). Comments on their own lines only.
openapi: 3.1.0
info:
  title: Checkrail Pay API
  version: 1.0.0
  summary: Departures and payment requests from other software, checked before money moves.
  description: >-
    For booking systems, ERPs and accounting tools. A booking system sends its departures (the booking feed),
    which the payment rules use as job records. A system of record sends payment requests, which go through the
    same checks as a clerk's request: policy and the business's autonomy setting decide what happens next.


    Nothing in this API can approve, release or send a payment, or read or change a supplier's payout details.


    Every call needs an API key from CHECKRAIL_API_KEYS as a bearer token. Errors always have the shape
    {"error": {"code": "...", "message": "..."}}, with "details" listing each field for a validation error.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1
    description: This Checkrail server
security:
  - apiKey: []
tags:
  - name: Departures
    description: The booking feed. Needs the departures:write scope.
  - name: Requests
    description: Payment requests. requests:write to send, requests:read to read back.
  - name: Vendors
    description: Supplier lookup. Needs the vendors:read scope.
  - name: Meta
    description: This description.
paths:
  /departures:
    post:
      tags: [Departures]
      operationId: upsertDepartures
      summary: Send departures (upsert by external_id)
      description: >-
        Creates or updates departures by the booking system's own id. Sending a departure again replaces its dates,
        guests and services. A departure an approver imported from a manifest or typed in is never taken over or
        changed by the feed (409 departure_conflict); an approver changes it in Checkrail. A call is all or nothing: one invalid departure and
        nothing is saved. Afterwards the requests waiting on the suppliers it touched are checked again, as after a
        manifest import; policy decides what that means. With each supplier's rate card, a departure sets what a job
        should cost, so give departures:write only to the booking system itself.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartureUpsert"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartureUpsertResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      tags: [Departures]
      operationId: listDepartures
      summary: Read departures back
      description: Every departure on file, from any source, starting on or after since when given (at most 1000).
      parameters:
        - name: since
          in: query
          required: false
          description: Only departures that start on or after this date.
          schema:
            type: string
            format: date
            examples: ["2026-10-01"]
      responses:
        "200":
          description: The departures, earliest first.
          content:
            application/json:
              schema:
                type: object
                required: [departures]
                properties:
                  departures:
                    type: array
                    items:
                      $ref: "#/components/schemas/Departure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /requests:
    post:
      tags: [Requests]
      operationId: createRequest
      summary: Put a payment request in the inbox
      description: >-
        Goes through the same ingest as a clerk's request, with the payee, amount, currency and reference fixed as
        sent, and is recorded as coming from this key (audit actor api:<key name>). Policy and the autonomy setting
        decide: it may be blocked, wait for evidence or a person, or be scheduled by Autopilot inside the owner's caps
        with a cancel window. The answer is the request as it stands after the checks. A request to a supplier with
        any bill recorded in the last 180 days, or whose reference matches a bill of the supplier (however spelt, any
        kind, any state), is never paid without a person, and is answered the same whether it matches a bill or not
        and whether it fits or not.


        What the key attaches (evidence rows) is its own say-so, as a clerk's typed record is, so a person approves
        unless the business's own records already support the payment. With the requests:attest scope it counts as
        the business's own records instead, as a booking platform's would. Documents attached as files are read and
        checked against the request the way a clerk's upload is; a supplier's own invoice still goes to a person. Only
        the business's own records (an attest key's evidence rows) can record a bill total that later payments under
        the same reference are held to; a key's typed rows and its documents never can.


        An Idempotency-Key header is required: a retry with the same key returns the first answer and never creates
        a second request.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequestIn"
      responses:
        "201":
          description: >-
            Created and checked. A replay carries the header Idempotency-Replayed. A key with requests:read gets the
            request as it stands (PaymentRequest); a key without it gets only the id, the status and its own
            Idempotency-Key back (PaymentRequestCreated).
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PaymentRequest"
                  - $ref: "#/components/schemas/PaymentRequestCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      tags: [Requests]
      operationId: listRequests
      summary: List the requests this key made
      description: >-
        Newest first, at most 25. A key only ever sees the requests it made itself. List rows carry the status and the
        stored verdict only, with empty reasons and rules_failed; read one request for those.
      parameters:
        - name: reference
          in: query
          required: false
          description: Only requests with this reference (case does not matter).
          schema:
            type: string
            maxLength: 64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 20
      responses:
        "200":
          description: The requests.
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /requests/{id}:
    get:
      tags: [Requests]
      operationId: getRequest
      summary: One request this key made
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /vendors:
    get:
      tags: [Vendors]
      operationId: searchVendors
      summary: Look up suppliers
      description: Id, name and whether payout details were verified. Never the payout details themselves.
      parameters:
        - name: q
          in: query
          required: false
          description: Part of the supplier's name; accents and case do not matter.
          schema:
            type: string
            maxLength: 80
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Matching suppliers, by name.
          content:
            application/json:
              schema:
                type: object
                required: [vendors]
                properties:
                  vendors:
                    type: array
                    items:
                      $ref: "#/components/schemas/Vendor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /openapi.json:
    get:
      tags: [Meta]
      operationId: getOpenApi
      summary: This description, as JSON
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: >-
        A key from CHECKRAIL_API_KEYS (name:secret:scopes, comma separated), sent as "Authorization: Bearer <secret>".
        Scopes are departures:write, requests:write, requests:attest, requests:read and vendors:read. A malformed
        setting refuses every call with 401, without saying why to the caller; the owner sees it in Settings. Each key
        may make 120 calls a minute unless CHECKRAIL_API_RATE_LIMIT says otherwise. Wrong keys are limited per
        address; a valid key is never locked out by them.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Your own id for this one call. A retry with the same key and body returns the first answer; the same key with
        a different body is refused (422). Only successful answers are kept, for seven days.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_.:-]{8,128}$"
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: Your own id for this one payment request. Required. See IdempotencyKey.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_.:-]{8,128}$"
  headers:
    IdempotencyReplayed:
      description: "true when the answer is the stored answer to an earlier call with the same Idempotency-Key."
      schema:
        type: string
        enum: ["true"]
    RetryAfter:
      description: Seconds to wait before trying again.
      schema:
        type: integer
  responses:
    BadRequest:
      description: The body is not JSON, or the Idempotency-Key header is missing or malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No API key, or an unknown one.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The key does not have the scope this call needs (insufficient_scope), or the call came from another site's page.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such request made by this key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: >-
        idempotency_in_progress (a call with this Idempotency-Key is still running) or departure_conflict (a code
        already belongs to another departure).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: The body is over the limit (512 KB for departures; about 8.5 MB for a request with documents).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: The body is not sent as application/json.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: >-
        validation_failed (details lists each field), idempotency_conflict (the key was used with a different body),
        document_refused or request_refused.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many calls from this key this minute, or too many wrong keys from this address.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: No business is set up in this Checkrail yet (not_set_up).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [validation_failed]
            message:
              type: string
            details:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                    examples: ["departures[0].start_date"]
                  message:
                    type: string
    ServiceIn:
      type: object
      description: One supplier's part of a departure. Send vendor_id, or vendor with the supplier's exact name.
      required: [unit, quantity]
      additionalProperties: false
      properties:
        vendor_id:
          type: string
        vendor:
          type: string
        unit:
          type: string
          enum: [day, vehicle_day, guest_night, room_night, guest, trip]
        quantity:
          type: integer
          minimum: 1
          maximum: 10000
    DepartureIn:
      type: object
      required: [external_id, code, start_date, end_date, guests]
      additionalProperties: false
      properties:
        external_id:
          type: string
          description: The booking system's own id for this departure.
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:/#-]{0,99}$"
        code:
          type: string
          description: The tour code invoices and job sheets name, e.g. HG-4D-1004.
          pattern: "^[A-Za-z0-9][A-Za-z0-9-]{2,31}$"
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        guests:
          type: integer
          minimum: 0
          maximum: 500
        services:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/ServiceIn"
    DepartureUpsert:
      type: object
      required: [departures]
      additionalProperties: false
      properties:
        departures:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/DepartureIn"
    DepartureUpsertResult:
      type: object
      required: [departures, rechecked]
      properties:
        departures:
          type: array
          items:
            type: object
            required: [external_id, id, code, result]
            properties:
              external_id:
                type: string
              id:
                type: string
              code:
                type: string
              result:
                type: string
                enum: [created, updated]
        rechecked:
          type: integer
          description: Waiting requests checked again because a supplier on these departures has them.
    Departure:
      type: object
      required: [id, external_id, code, start_date, end_date, guests, source, updated_at, services]
      properties:
        id:
          type: string
        external_id:
          type: [string, "null"]
          description: null for a departure that did not come from the API.
        code:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        guests:
          type: integer
        source:
          type: string
          enum: [csv, manual, booking_system]
        updated_at:
          type: string
          format: date-time
        services:
          type: array
          items:
            type: object
            required: [vendor_id, vendor, unit, quantity]
            properties:
              vendor_id:
                type: string
              vendor:
                type: string
              unit:
                type: string
              quantity:
                type: integer
    EvidenceIn:
      type: object
      required: [kind, label]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [contract, booking, job_sheet, invoice, message, photo, receipt, purchase_order]
        label:
          type: string
          maxLength: 200
        amount:
          $ref: "#/components/schemas/AmountIn"
        reference:
          type: string
          maxLength: 64
        excerpt:
          type: string
          maxLength: 2000
          description: "The words of the record that matter: who, what, how much."
    DocumentIn:
      type: object
      required: [name, content_type, data]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 120
        content_type:
          type: string
          enum: [application/pdf, image/png, image/jpeg, image/webp, image/gif, text/plain]
        data:
          type: string
          contentEncoding: base64
          description: The file, base64 encoded. At most 2 MB once decoded.
        kind:
          type: string
          enum: [contract, booking, job_sheet, invoice, message, photo, receipt, purchase_order]
    AmountIn:
      description: 'Major units, no symbol: "960.00", 960 or "2,500,000". Whole units for VND.'
      oneOf:
        - type: string
        - type: number
    PaymentRequestIn:
      type: object
      required: [amount, currency]
      additionalProperties: false
      description: Send payee or vendor_id.
      properties:
        payee:
          type: string
          maxLength: 80
          description: "The supplier's full name as on file, or their contact email."
        vendor_id:
          type: string
          description: A supplier id from GET /vendors.
        amount:
          $ref: "#/components/schemas/AmountIn"
        currency:
          type: string
          enum: [USD, VND, PHP, THB]
        reference:
          type: string
          maxLength: 64
          description: >-
            Invoice, job, trip or booking reference (letters and digits with . _ / # : - between them). Duplicates
            and departures are matched on it.
        description:
          type: string
          maxLength: 2000
          description: The request in the system's own words.
        source_type:
          type: string
          enum: [invoice, job_completion, booking]
          default: invoice
        evidence:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/EvidenceIn"
        documents:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/DocumentIn"
    Money:
      type: object
      required: [value, currency]
      properties:
        value:
          type: string
          examples: ["960.00"]
        currency:
          type: string
        display:
          type: string
          examples: [USD 960.00]
    Settlement:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [not_sent, sending, settled, returned, failed]
        rail:
          type: [string, "null"]
          enum: [paypal, stellar, wise, bank_file, null]
        provider_id:
          type: [string, "null"]
          description: The rail's own id, such as a PayPal payout batch id.
        settled_at:
          type: [string, "null"]
          format: date-time
        sent:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        fee:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        received:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
    PaymentRequestCreated:
      type: object
      description: The answer to a key without requests:read. No reasons and nothing about other payments.
      required: [id, status, idempotency_key]
      additionalProperties: false
      properties:
        id:
          type: string
        status:
          type: string
          enum: [blocked, waiting_for_evidence, waiting_for_approval, scheduled, approved, sending, paid, returned, cancelled, failed, disputed]
        idempotency_key:
          type: string
    PaymentRequest:
      type: object
      description: A request as it stands. Never payout details.
      required: [id, status, state, verdict, reasons, rules_failed, payee, amount, reference, rail, releases_at, settlement, created_at, updated_at]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [blocked, waiting_for_evidence, waiting_for_approval, scheduled, approved, sending, paid, returned, cancelled, failed, disputed]
        state:
          type: string
          description: The internal state behind status.
        verdict:
          type: [string, "null"]
          enum: [pay, hold, block, approved, null]
          description: >-
            What the rules say. pay still means policy and the autonomy setting decide who sends it. A request to a
            supplier with a bill in the last 180 days, or whose reference matches a bill of the supplier, always reads
            status waiting_for_approval, state awaiting_approval, verdict hold, rules_failed [bill_review] and one fixed
            reason while it waits, whether it matches or fits a bill or not; a person reviews it. Once a person approved it and until it is paid, refused or
            cancelled, verdict approved with the same reason; after that, its own status only.
        reasons:
          type: array
          items:
            type: string
          description: >-
            Why it is held or blocked: one fixed sentence per rule in rules_failed, never text from the books, so
            nothing about other suppliers or other payments. Empty once the request has left the waiting states.
        rules_failed:
          type: array
          items:
            type: string
          examples:
            - [expected_amount]
        payee:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id:
                  type: string
                name:
                  type: string
            - type: "null"
        amount:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        withheld:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        reference:
          type: [string, "null"]
        rail:
          type: [string, "null"]
          description: The rail the router chose.
        releases_at:
          type: [string, "null"]
          format: date-time
          description: When Autopilot sends it, unless a person cancels first.
        settlement:
          $ref: "#/components/schemas/Settlement"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Vendor:
      type: object
      required: [id, name, role, country, status, verified]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
        country:
          type: string
        status:
          type: string
          enum: [active, blocked]
        verified:
          type: boolean
          description: Whether a person verified this supplier's payout details.
